<h1>Story Script Editor</h1>
<p>适用于 Wish 视觉小说引擎的故事脚本编辑器</p>
<h2>项目目录结构</h2>
<ul>
<li>json_editor.py: 主程序</li>
<li>schema.json: 故事脚本文件的schema</li>
<li>storyJsonStandard.md: 故事脚本文件的编辑规范（面向用户，未完善）</li>
<li>jsons/*.json: 用于测试的故事脚本</li>
<li>ArtAssets/: 艺术资产描述文件的规范，与主程序无关</li>
<li>其余文件（文件夹）都为构建产物，请忽略</li>
</ul>
